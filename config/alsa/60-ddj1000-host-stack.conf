pcm_slave.ddj1000_hw_6ch {
    pcm "hw:DDJ1000,0"
    channels 6
}

pcm.ddj1000_master_raw {
    type route
    slave ddj1000_hw_6ch
    ttable.0.0 1
    ttable.1.1 1
}

pcm.ddj1000_cue_raw {
    type route
    slave ddj1000_hw_6ch
    ttable.0.2 1
    ttable.1.3 1
}

pcm.ddj1000_aux_raw {
    type route
    slave ddj1000_hw_6ch
    ttable.0.4 1
    ttable.1.5 1
}

pcm.ddj1000_master {
    type plug
    slave.pcm "ddj1000_master_raw"
    hint {
        show on
        description "DDJ-1000 Master (1/2)"
    }
}

pcm.ddj1000_cue {
    type plug
    slave.pcm "ddj1000_cue_raw"
    hint {
        show on
        description "DDJ-1000 Cue (3/4)"
    }
}

pcm.ddj1000_aux {
    type plug
    slave.pcm "ddj1000_aux_raw"
    hint {
        show on
        description "DDJ-1000 Aux or Sampler (5/6)"
    }
}

ctl.ddj1000_master {
    type hw
    card DDJ1000
}

ctl.ddj1000_cue {
    type hw
    card DDJ1000
}

ctl.ddj1000_aux {
    type hw
    card DDJ1000
}