pcm_slave.ddj1000_hw_6ch {
    pcm "hw:DDJ1000,0"
    channels 6
}

pcm.ddj1000_master_raw {
    type route
    slave ddj1000_hw_6ch
    ttable.0.0 1
    ttable.1.1 1
}

pcm.ddj1000_cue_raw {
    type route
    slave ddj1000_hw_6ch
    ttable.0.2 1
    ttable.1.3 1
}

pcm.ddj1000_aux_raw {
    type route
    slave ddj1000_hw_6ch
    ttable.0.4 1
    ttable.1.5 1
}

pcm.ddj1000_master {
    type plug
    slave.pcm "ddj1000_master_raw"
    hint {
        show on
        description "DDJ-1000 Master (1/2)"
    }
}

pcm.ddj1000_cue {
    type plug
    slave.pcm "ddj1000_cue_raw"
    hint {
        show on
        description "DDJ-1000 Cue (3/4)"
    }
}

pcm.ddj1000_aux {
    type plug
    slave.pcm "ddj1000_aux_raw"
    hint {
        show on
        description "DDJ-1000 Aux or Sampler (5/6)"
    }
}

ctl.ddj1000_master {
    type hw
    card DDJ1000
}

ctl.ddj1000_cue {
    type hw
    card DDJ1000
}

ctl.ddj1000_aux {
    type hw
    card DDJ1000
}
# One PCM for the whole 6-channel DDJ-1000 playback stream (hw is exclusive, 1 subdevice).
# Applications that need Master and Cue at the same time (Mixxx) must open this single device:
# channels 1/2 = Master/Program, 3/4 = Cue/Monitor, 5/6 = Aux/Sampler (hypothesis).
# Opening ddj1000_master and ddj1000_cue concurrently fails with "Device unavailable".
pcm.ddj1000_6ch {
    type plug
    slave {
        pcm "hw:DDJ1000,0"
        channels 6
    }
    hint {
        show on
        description "DDJ-1000 6ch (1/2 Master, 3/4 Cue, 5/6 Aux)"
    }
}

ctl.ddj1000_6ch {
    type hw
    card DDJ1000
}
